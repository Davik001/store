spring.application.name=client-service
spring.r2dbc.url=r2dbc:postgresql://localhost:5435/client_db
spring.r2dbc.username=chief
spring.r2dbc.password=root

server.port= 8081

spring.datasource.url=jdbc:postgresql://localhost:5435/client_db
spring.datasource.username=chief
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.url=jdbc:postgresql://localhost:5435/client_db
spring.flyway.user=chief
spring.flyway.password=root
spring.flyway.enabled=true
spring.flyway.locations=classpath:db.migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

spring.jackson.property-naming-strategy=SNAKE_CASE

# JPA off
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

logging.level.org.springframework.r2dbc=DEBUG
logging.level.com.example.client_service.service.ClientService = DEBUG