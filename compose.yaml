services:

  database:
    image: postgres:13.16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: chief
      POSTGRES_PASSWORD: root
      POSTGRES_DB: chief
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # проверять, жив ли сервис
      test: ["CMD-SHELL", "pg_isready -U chief -d chief"]
      interval: 10s
      timeout: 5s
      retries: 5

  # БД для NotificationService
  notification_db:
    image: postgres:13.16
    container_name: notification_db
    restart: always
    environment:
      POSTGRES_USER: chief
      POSTGRES_PASSWORD: root
      POSTGRES_DB: notification_db
    ports:
      - '5433:5432'  # Используем другой порт, чтобы не конфликтовать с основной БД
    volumes:
      - notifydata:/var/lib/postgresql/data
    healthcheck: # проверять, жив ли сервис
      test: ["CMD-SHELL", "pg_isready -U chief -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # БД для SubscriptionService
  subs_db:
    image: postgres:13.16
    container_name: subs_db
    restart: always
    environment:
      POSTGRES_USER: chief
      POSTGRES_PASSWORD: root
      POSTGRES_DB: subs_db
    ports:
      - '5434:5432'  # Еще один порт для избежания конфликтов
    volumes:
      - subsdata:/var/lib/postgresql/data
    healthcheck: # проверять, жив ли сервис
      test: ["CMD-SHELL", "pg_isready -U chief -d subs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

      # БД для ClientService
  client_db:
        image: postgres:13.16
        container_name: client_db  # Имя контейнера (можно обращаться через `docker ps` или `docker logs`)
        restart: always  # Перезапускать контейнер при падении
        environment: # Переменные окружения, которые PostgreSQL использует при старте
          POSTGRES_USER: chief  # Логин для подключения к БД
          POSTGRES_PASSWORD: root  # Пароль
          POSTGRES_DB: client_db  # Название создаваемой по умолчанию базы данных
        ports:
          - '5435:5432'  # Пробрасываем порт: внешний 5435, внутренний 5432 (дефолтный в PostgreSQL)
        volumes:
          - clientdata:/var/lib/postgresql/data  # Монтируем volume — чтобы данные сохранялись
        healthcheck: # Проверка, что БД запущена и готова принимать подключения
          test: [ "CMD-SHELL", "pg_isready -U chief -d client_db" ]
          interval: 10s
          timeout: 5s
          retries: 5

      # БД для OrderService
  order_db:
        image: postgres:13.16
        container_name: order_db
        restart: always
        environment:
          POSTGRES_USER: chief
          POSTGRES_PASSWORD: root
          POSTGRES_DB: order_db
        ports:
          - '5436:5432'
        volumes:
          - orderdata:/var/lib/postgresql/data
        healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U chief -d order_db" ]
          interval: 10s
          timeout: 5s
          retries: 5

      # БД для employee service
  employee_db:
        image: postgres:13.16
        container_name: employee_db
        restart: always
        environment:
          POSTGRES_USER: chief
          POSTGRES_PASSWORD: root
          POSTGRES_DB: employee_db
        ports:
          - '5437:5432'
        volumes:
          - employeedata:/var/lib/postgresql/data
        healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U chief -d employee_db" ]
          interval: 10s
          timeout: 5s
          retries: 5



  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    ports:
      - '2181:2181'
    healthcheck:
      test: [ "CMD", "echo", "ruok", "|", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy  # Ждём, пока Zookeeper будет готов
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://host.docker.internal:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "kafka:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  notifydata:
  subsdata:
  clientdata: # volume для client_db
  orderdata:    # volume для order_db
  employeedata:   # volume для employee_db