spring.application.name=product-service

spring.datasource.url=jdbc:postgresql://localhost:5438/product_db
spring.datasource.username=chief
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.r2dbc.url=r2dbc:postgresql://localhost:5438/product_db
spring.r2dbc.username=chief
spring.r2dbc.password=root
logging.level.org.springframework.r2dbc=DEBUG

server.port=8090

spring.flyway.url=jdbc:postgresql://localhost:5438/product_db
spring.flyway.user=chief
spring.flyway.password=root
spring.flyway.enabled=true
spring.flyway.locations=classpath:db.migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

spring.jackson.property-naming-strategy=SNAKE_CASE

# JPA off
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never